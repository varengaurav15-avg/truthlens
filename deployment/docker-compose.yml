version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.txt
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ../models:/app/models       # persist downloaded model weights
      - ../logs:/app/logs           # persist logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    image: python:3.11-slim
    working_dir: /app
    command: >
      bash -c "pip install streamlit httpx pillow --quiet &&
               streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ../frontend:/app/frontend
    environment:
      - API_BASE=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1",
             "--spider", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
