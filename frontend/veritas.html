      h('p',{style:{fontSize:14.5,lineHeight:1.8,color:T.m,margin:'0 0 26px',maxWidth:460}},
        'Frame-level deepfake forensics, neural vocoder detection, and knowledge-graph fact verification — resolved into one calibrated credibility signal.'),
      h('div',{style:{display:'flex',gap:30,paddingTop:20,borderTop:'1px solid '+T.bd,flexWrap:'wrap'}},
        [['99.2%','Recall'],['4','Modalities'],['<120ms','p50 latency'],['31M','KG edges']].map(function(x,i){
          return h('div',{key:i},
            h('div',{style:{fontFamily:T.fm,fontSize:18,fontWeight:700,color:T.w,lineHeight:1}},x[0]),
            h('div',{style:{fontSize:9,textTransform:'uppercase',letterSpacing:'.1em',color:T.dim,marginTop:7}},x[1]));}))),
    h('div',{className:'nc',style:{height:340,overflow:'hidden',position:'relative',background:T.sub}},
      h(Detective),
      h('div',{style:{position:'absolute',left:14,top:12,fontFamily:T.fm,fontSize:8.5,
        letterSpacing:'.14em',color:T.ghost,pointerEvents:'none'}},'NOIR / POINT-CLOUD VIEWPORT'),
      h('div',{style:{position:'absolute',right:14,bottom:12,fontFamily:T.fm,fontSize:8.5,
        color:T.ghost,pointerEvents:'none'}},'MOVE CURSOR TO ORBIT')));

  var body;
  if(s.view==='dashboard'){
    body=[hero,
      h('div',{key:'r1',className:'row-a'},scanner,gauge),
      h('div',{key:'r2',className:'row-b'},signals,terrain),
      h('div',{key:'r3'},feedTable())];
  } else if(s.view==='scanner'){
    body=[h('div',{key:'r1',className:'row-a'},scanner,gauge),
      h('div',{key:'r2',className:'row-c'},pipeline,signals)];
  } else if(s.view==='intel'){
    body=[h('div',{key:'r1',style:{marginBottom:18}},feedTable()),
      h('div',{key:'r2',className:'row-b'},signals,terrain)];
  } else if(s.view==='graph'){
    body=[h('div',{key:'r1',className:'row-c'},
      h('div',{className:'nc',style:{height:420,overflow:'hidden',background:T.sub}},h(Detective)),
      pipeline)];
  } else {
    body=[Card({style:{padding:24}},[
      Head(I.gear,T.m,'Console settings','ENGINE CONFIGURATION'),
      [['Detection threshold','0.75 · calibrated on FF++ c23'],
       ['Knowledge graph','Neo4j Aura · 31M edges · ap-southeast-2'],
       ['NLI model','cross-encoder/nli-deberta-v3-small'],
       ['Vision backbone','EfficientNet-B0 · Grad-CAM enabled'],
       ['API endpoint','http://127.0.0.1:8000'],
       ['Telemetry','Disabled · local inference only']].map(function(r,i){
        return h('div',{key:i,style:{display:'flex',justifyContent:'space-between',alignItems:'center',
          padding:'13px 0',borderBottom:i<5?'1px solid '+T.bd:'none',gap:16}},
          h('span',{style:{fontSize:12.5,color:T.w,fontWeight:500}},r[0]),
          h('span',{style:{fontFamily:T.fm,fontSize:10,color:T.dim,textAlign:'right'}},r[1]));})])];
  }

  return h('div',{style:{height:'100%',display:'flex',background:T.canvas}},
    rail,
    h('div',{style:{flex:1,minWidth:0,display:'flex',flexDirection:'column'}},
      topbar,
      h('div',{key:s.view,style:{flex:1,overflowY:'auto',padding:'22px 24px 30px',animation:'vfade .25s ease'}},
        body,
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',
          gap:16,marginTop:28,paddingTop:18,borderTop:'1px solid '+T.bd}},
          h('div',{style:{display:'flex',gap:20,flexWrap:'wrap',fontFamily:T.fm,fontSize:9.5,color:T.dim}},
            h('span',null,'VERITAS AI v2.4.1'),h('span',null,'LATENCY '+lat+'ms'),
            h('span',null,'REGION ap-southeast-2'),
            h('span',{style:{color:s.api==='ok'?T.em:T.dim}},s.api==='ok'?'API LIVE':'API STANDBY')),
          h('div',{style:{display:'flex',gap:20}},['Docs','API','Model card','Audit log'].map(function(l){
            return h('span',{key:l,className:'nlnk',style:{fontSize:11,color:T.ghost,cursor:'pointer',transition:'color .15s'}},l);}))))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
